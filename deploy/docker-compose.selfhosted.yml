# Own-server add-on: free local AI (local_ai + Ollama). See deploy/SELF_HOSTED.md.
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.selfhosted.yml --env-file .env up -d --build
#
# Calls use LiveKit Cloud by default (LIVEKIT_URL=wss://<project>.livekit.cloud): nothing else to run.
# Self-hosted LiveKit instead: also start deploy/docker-compose.livekit.yml and set in .env
#   CADDYFILE=Caddyfile.selfhosted  LIVEKIT_DOMAIN=livekit.yourdomain.in  LIVEKIT_WORKER_URL=ws://host.docker.internal:7880

services:
  local-ai:
    build: { context: .., dockerfile: deploy/local-ai.Dockerfile }
    restart: unless-stopped
    # Only what this service needs (not the whole .env): the Hugging Face token stays out of the other containers.
    environment:
      LOCAL_AI_HOST: 0.0.0.0
      LOCAL_AI_SECRET: ${LOCAL_AI_SECRET:?set LOCAL_AI_SECRET in .env}
      HF_TOKEN: ${HF_TOKEN:-}
      LOCAL_AI_MEMORY_BUDGET_GB: ${LOCAL_AI_MEMORY_BUDGET_GB:-24}
      LOCAL_AI_TORCH_THREADS: ${LOCAL_AI_TORCH_THREADS:-16}
      LOCAL_WHISPER_THREADS: ${LOCAL_WHISPER_THREADS:-8}
      LOCAL_WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-large-v3-turbo}
      LOCAL_WHISPER_FAST_MODEL: ${LOCAL_WHISPER_FAST_MODEL:-small}
      LOCAL_MT_INDIC_INDIC_MODE: ${LOCAL_MT_INDIC_INDIC_MODE:-direct}
      LOCAL_MT_BEAMS: ${LOCAL_MT_BEAMS:-2}
      LOCAL_TTS_DTYPE: ${LOCAL_TTS_DTYPE:-float32}
      LOCAL_TTS_LANGUAGES: ${LOCAL_TTS_LANGUAGES:-ta,hi,en}
    volumes:
      - models:/models
    # Not published: only the backend and worker reach it, on the internal Docker network.

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama

  backend:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      OLLAMA_URL: http://ollama:11434

  jobs:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      OLLAMA_URL: http://ollama:11434

  worker:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      # Empty = use LIVEKIT_URL (LiveKit Cloud). Self-hosted LiveKit on the host network: ws://host.docker.internal:7880
      LIVEKIT_WORKER_URL: ${LIVEKIT_WORKER_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:-}
    volumes:
      # Caddyfile = the app only (LiveKit Cloud); Caddyfile.selfhosted adds HTTPS for a self-hosted LiveKit.
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  models:
  ollama:
