# Own-server add-on: free local AI (local_ai + Ollama) and HTTPS for a self-hosted LiveKit.
# Use together with the main file and the LiveKit file (see deploy/SELF_HOSTED.md):
#
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.selfhosted.yml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.livekit.yml --env-file .env up -d

services:
  local-ai:
    build: { context: .., dockerfile: deploy/local-ai.Dockerfile }
    restart: unless-stopped
    # Only what this service needs (not the whole .env): the Hugging Face token stays out of the other containers.
    environment:
      LOCAL_AI_HOST: 0.0.0.0
      LOCAL_AI_SECRET: ${LOCAL_AI_SECRET:?set LOCAL_AI_SECRET in .env}
      HF_TOKEN: ${HF_TOKEN:-}
      LOCAL_AI_MEMORY_BUDGET_GB: ${LOCAL_AI_MEMORY_BUDGET_GB:-24}
      LOCAL_AI_TORCH_THREADS: ${LOCAL_AI_TORCH_THREADS:-16}
      LOCAL_WHISPER_THREADS: ${LOCAL_WHISPER_THREADS:-8}
      LOCAL_WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-large-v3-turbo}
      LOCAL_WHISPER_FAST_MODEL: ${LOCAL_WHISPER_FAST_MODEL:-small}
      LOCAL_MT_INDIC_INDIC_MODE: ${LOCAL_MT_INDIC_INDIC_MODE:-direct}
      LOCAL_MT_BEAMS: ${LOCAL_MT_BEAMS:-2}
      LOCAL_TTS_DTYPE: ${LOCAL_TTS_DTYPE:-float32}
      LOCAL_TTS_LANGUAGES: ${LOCAL_TTS_LANGUAGES:-ta,hi,en}
    volumes:
      - models:/models
    # Not published: only the backend and worker reach it, on the internal Docker network.

  ollama:
    image: ollama/ollama
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama:/root/.ollama

  backend:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      OLLAMA_URL: http://ollama:11434

  jobs:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      OLLAMA_URL: http://ollama:11434

  worker:
    environment:
      LOCAL_AI_URL: http://local-ai:8090
      # LiveKit runs on the host network (docker-compose.livekit.yml); reach it without leaving the server.
      LIVEKIT_WORKER_URL: ws://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    environment:
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN in .env}
    volumes:
      - ./Caddyfile.selfhosted:/etc/caddy/Caddyfile:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  models:
  ollama:
