# Self-hosted LiveKit + LiveKit SIP (phone calls) + Redis, instead of LiveKit Cloud.
# Based on the official livekit/sip docker-compose.yaml. Run on a Linux server with a public IP:
#
#   docker compose -f deploy/docker-compose.livekit.yml --env-file .env up -d
#
# Open these ports to the internet (see docs/TELEPHONY.md):
#   7880/tcp (signalling, put behind TLS as wss://), 7881/tcp, 50000-60000/udp (WebRTC media),
#   5060/udp+tcp (SIP — restrict to your provider's IPs), 10000-20000/udp (SIP media / RTP).
# Then set LIVEKIT_URL=wss://<livekit domain> and LIVEKIT_WORKER_URL=ws://127.0.0.1:7880 in .env.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes"]
    network_mode: host
    volumes:
      - redis_data:/data

  livekit:
    image: livekit/livekit-server
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
        redis:
          address: 127.0.0.1:6379
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - https://${APP_DOMAIN:?set APP_DOMAIN}/api/phone/livekit-webhook/
    depends_on: [redis]

  sip:
    image: livekit/sip
    restart: unless-stopped
    network_mode: host
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY}'
        api_secret: '${LIVEKIT_API_SECRET}'
        ws_url: 'ws://127.0.0.1:7880'
        redis:
          address: '127.0.0.1:6379'
        sip_port: 5060
        rtp_port: 10000-20000
        use_external_ip: true
        logging:
          level: info
    depends_on: [livekit]

volumes:
  redis_data:
