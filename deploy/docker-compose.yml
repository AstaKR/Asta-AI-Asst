# Production-style deployment on one Linux server (Docker + Docker Compose).
# LiveKit is NOT included: use LiveKit Cloud, or self-host it with deploy/docker-compose.livekit.yml
# (LiveKit + SIP phone calls + Redis, see docs/TELEPHONY.md), and put its URL/key/secret in .env.
#
#   cp .env.example .env      # then fill in production values (see deploy/README.md)
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: translator
      POSTGRES_USER: translator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U translator"]
      interval: 5s
      retries: 10

  backend:
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://translator:${POSTGRES_PASSWORD}@db:5432/translator
      DJANGO_DEBUG: "false"
      MEDIA_ROOT: /app/media
    volumes:
      - static:/app/backend/staticfiles
      - media:/app/media
    depends_on:
      db: { condition: service_healthy }

  jobs:
    # Meeting transcription / translation / summary job runner (same image as the backend).
    build: { context: .., dockerfile: deploy/backend.Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://translator:${POSTGRES_PASSWORD}@db:5432/translator
      DJANGO_DEBUG: "false"
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    command: ["python", "manage.py", "process_meetings"]
    depends_on: [backend]

  worker:
    build: { context: .., dockerfile: deploy/worker.Dockerfile }
    restart: unless-stopped
    env_file: ../.env
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on: [backend]

  web:
    build: { context: .., dockerfile: deploy/web.Dockerfile }
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - static:/srv/static:ro
      - caddy_data:/data
    depends_on: [backend]

volumes:
  media:
  pgdata:
  static:
  caddy_data:
